<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐳 Docker 容器监控</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
        .container{max-width:1400px;margin:0 auto}
        .header{background:rgba(255,255,255,0.95);border-radius:16px;padding:20px 28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}
        .header h1{font-size:24px;color:#2d3748}
        .header-info{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .badge{padding:5px 14px;border-radius:20px;font-size:13px;color:#fff;background:#48bb78}
        .badge.warn{background:#ecc94b}
        .time{color:#718096;font-size:13px}
        .btn{padding:7px 18px;border:none;border-radius:8px;cursor:pointer;font-size:13px;transition:all .3s;color:#fff}
        .btn:hover{transform:scale(1.05)}
        .btn-primary{background:#4299e1}
        .btn-primary:hover{background:#3182ce}
        .btn-success{background:#48bb78}
        .btn-success:hover{background:#38a169}
        .btn-danger{background:#fc8181}
        .btn-danger:hover{background:#f56565}
        .btn-warning{background:#ecc94b;color:#2d3748}
        .btn-warning:hover{background:#d69e2e}
        .btn-purple{background:#9f7aea;color:#fff}
        .btn-purple:hover{background:#805ad5}
        .btn-gray{background:#a0aec0;color:#fff}
        .btn-gray:hover{background:#718096}
        .config-bar{background:#f7fafc;padding:12px 16px;border-radius:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
        .config-bar input{padding:6px 12px;border:2px solid #e2e8f0;border-radius:6px;font-size:14px;width:280px;flex:1;min-width:180px}
        .config-bar input:focus{outline:none;border-color:#4299e1}
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
        .stat{background:rgba(255,255,255,0.95);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
        .stat .icon{font-size:28px}
        .stat .num{font-size:26px;font-weight:700;color:#2d3748}
        .stat .label{font-size:13px;color:#718096}
        .stat.green .num{color:#48bb78}
        .stat.red .num{color:#fc8181}
        .stat.yellow .num{color:#ecc94b}
        .actions{background:rgba(255,255,255,0.95);border-radius:12px;padding:14px 20px;margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
        .actions .query{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .actions .query input{padding:7px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;width:220px}
        .actions .query input:focus{outline:none;border-color:#4299e1}
        .table-wrap{background:rgba(255,255,255,0.95);border-radius:12px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,0.08);overflow:hidden}
        .table-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px}
        .table-header h2{font-size:18px;color:#2d3748}
        .filters{display:flex;gap:10px;flex-wrap:wrap}
        .filters input,.filters select{padding:6px 12px;border:2px solid #e2e8f0;border-radius:6px;font-size:13px}
        .filters input:focus,.filters select:focus{outline:none;border-color:#4299e1}
        .table-scroll{overflow-x:auto}
        table{width:100%;border-collapse:collapse;font-size:14px}
        thead{background:#f7fafc}
        th{padding:10px 14px;text-align:left;font-weight:600;color:#4a5568;font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0}
        td{padding:10px 14px;border-bottom:1px solid #e2e8f0;color:#2d3748}
        tbody tr:hover{background:#f7fafc}
        tbody tr.highlight{background:#ebf8ff}
        .dot{width:10px;height:10px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:6px}
        .dot.green{background:#48bb78;animation:pulse 1.5s infinite}
        .dot.red{background:#fc8181}
        .dot.yellow{background:#ecc94b}
        @keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
        .name{color:#2b6cb0;cursor:pointer;font-weight:500}
        .name:hover{text-decoration:underline}
        .id{font-family:monospace;font-size:12px;color:#4a5568;cursor:pointer}
        .id:hover{color:#2b6cb0}
        .tag{display:inline-block;background:#ebf8ff;color:#2b6cb0;padding:1px 10px;border-radius:12px;font-size:11px;margin:1px 3px 1px 0;white-space:nowrap}
        .action-btn{padding:3px 10px;border:none;border-radius:4px;cursor:pointer;font-size:11px;margin:0 2px;transition:all .2s}
        .action-btn.start{background:#48bb78;color:#fff}
        .action-btn.start:hover{background:#38a169}
        .action-btn.stop{background:#fc8181;color:#fff}
        .action-btn.stop:hover{background:#f56565}
        .action-btn.restart{background:#ecc94b;color:#2d3748}
        .action-btn.restart:hover{background:#d69e2e}
        .action-btn.detail{background:#4299e1;color:#fff}
        .action-btn.detail:hover{background:#3182ce}
        .footer{margin-top:14px;padding-top:14px;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;color:#718096;font-size:13px;flex-wrap:wrap;gap:8px}
        .query-result{background:#ebf8ff;padding:2px 12px;border-radius:12px;color:#2b6cb0;font-size:13px;display:none}
        .modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.5)}
        .modal-content{background:#fff;margin:5% auto;padding:28px;border-radius:12px;max-width:560px;max-height:80vh;overflow-y:auto;position:relative}
        .modal-close{position:absolute;right:18px;top:10px;font-size:26px;cursor:pointer;color:#a0aec0}
        .modal-close:hover{color:#2d3748}
        .modal-item{padding:10px 0;border-bottom:1px solid #e2e8f0}
        .modal-item strong{display:inline-block;min-width:90px;color:#4a5568}
        .loading{text-align:center;padding:40px;color:#718096}
        @media(max-width:768px){
            .stats{grid-template-columns:repeat(2,1fr)}
            .header{flex-direction:column;text-align:center}
            .actions{flex-direction:column}
            .actions .query{margin-left:0;width:100%}
            .actions .query input{width:100%}
            .config-bar{flex-direction:column;align-items:stretch}
            .table-header{flex-direction:column;align-items:stretch}
            .filters{flex-direction:column}
        }
        @media(max-width:480px){.stats{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="container">
    <header class="header">
        <h1>🐳 Docker 容器监控</h1>
        <div class="header-info">
            <span class="badge" id="statusBadge">✅ 运行中</span>
            <span class="time" id="updateTime">更新: --</span>
            <button class="btn btn-primary" onclick="refreshData()">🔄 刷新</button>
        </div>
    </header>
    <div class="config-bar">
        <span>🔗 API:</span>
        <input type="text" id="serverUrl" value="http://172.29.7.221:5000" placeholder="http://server:5000">
        <button class="btn btn-success" onclick="connectServer()">连接</button>
        <span id="connStatus" style="font-size:13px;color:#48bb78;">✅ 已连接</span>
    </div>
    <div class="stats">
        <div class="stat"><span class="icon">📦</span><div><div class="num" id="total">0</div><div class="label">总容器</div></div></div>
        <div class="stat green"><span class="icon">🟢</span><div><div class="num" id="running">0</div><div class="label">运行中</div></div></div>
        <div class="stat red"><span class="icon">🔴</span><div><div class="num" id="stopped">0</div><div class="label">已停止</div></div></div>
        <div class="stat yellow"><span class="icon">🟡</span><div><div class="num" id="other">0</div><div class="label">其他</div></div></div>
    </div>
    <div class="actions">
        <button class="btn btn-success" onclick="startAll()">▶️ 启动所有</button>
        <button class="btn btn-danger" onclick="stopAll()">⏹️ 停止所有</button>
        <button class="btn btn-warning" onclick="restartAll()">🔄 重启所有</button>
        <div class="query">
            <input type="text" id="queryInput" placeholder="🔍 容器ID/名称..." onkeydown="if(event.key==='Enter') query()">
            <button class="btn btn-purple" onclick="query()">查询</button>
            <button class="btn btn-gray" onclick="clearQuery()">清除</button>
        </div>
    </div>
    <div class="table-wrap">
        <div class="table-header">
            <div><h2>容器列表</h2><span class="query-result" id="queryResult"></span></div>
            <div class="filters">
                <input type="text" id="searchInput" placeholder="🔍 搜索..." oninput="filterTable()">
                <select id="statusFilter" onchange="filterTable()">
                    <option value="all">全部</option>
                    <option value="running">运行中</option>
                    <option value="exited">已停止</option>
                    <option value="created">已创建</option>
                </select>
            </div>
        </div>
        <div class="table-scroll">
            <table>
                <thead><tr><th>状态</th><th>容器名</th><th>容器ID</th><th>镜像</th><th>运行时间</th><th>端口</th><th>操作</th></tr></thead>
                <tbody id="tableBody"><tr><td colspan="7" class="loading">⏳ 加载中...</td></tr></tbody>
            </table>
        </div>
        <div class="footer"><span id="tableInfo">显示 0 个容器</span><span id="queryInfo"></span></div>
    </div>
    <div class="modal" id="modal"><div class="modal-content"><span class="modal-close" onclick="closeModal()">&times;</span><h2 id="modalTitle">容器详情</h2><div id="modalBody"></div></div></div>
</div>
<script>
let API=localStorage.getItem('docker_api')||'http://172.29.7.221:5000';
let all=[],queryResult=null;
document.getElementById('serverUrl').value=API;
document.addEventListener('DOMContentLoaded',()=>{refreshData();setInterval(refreshData,10000)});
function connectServer(){const u=document.getElementById('serverUrl').value.trim();if(u){API=u;localStorage.setItem('docker_api',u);document.getElementById('connStatus').textContent='🔄...';refreshData()}}
async function fetchData(){try{const r=await fetch(API+'/api/containers');if(!r.ok)throw new Error('HTTP '+r.status);document.getElementById('connStatus').textContent='✅ 已连接';document.getElementById('connStatus').style.color='#48bb78';return await r.json()}catch(e){document.getElementById('connStatus').textContent='❌ 连接失败';document.getElementById('connStatus').style.color='#fc8181';return[]}}
const STATUS={running:{label:'运行中',icon:'🟢',cls:'green'},exited:{label:'已停止',icon:'🔴',cls:'red'},created:{label:'已创建',icon:'🟡',cls:'yellow'}};
function query(){const q=document.getElementById('queryInput').value.trim();if(!q){clearQuery();return}const r=all.filter(c=>c.ID.toLowerCase().includes(q.toLowerCase())||c.IDShort.toLowerCase().includes(q.toLowerCase())||c.Name.toLowerCase().includes(q.toLowerCase()));queryResult=r;const el=document.getElementById('queryResult');el.style.display='inline';if(r.length===0){el.textContent='❌ 未找到: '+q;el.style.color='#fc8181';renderTable([]);document.getElementById('tableInfo').textContent='未找到: '+q}else{el.textContent='✅ 找到 '+r.length+' 个: '+q;el.style.color='#48bb78';renderTable(r);document.getElementById('tableInfo').textContent='显示 '+r.length+' 个 (查询: '+q+')'}document.getElementById('queryInfo').textContent='🔍 '+q+' ('+r.length+'个)'}
function clearQuery(){document.getElementById('queryInput').value='';document.getElementById('queryResult').style.display='none';document.getElementById('queryInfo').textContent='';queryResult=null;filterTable()}
function queryById(id){document.getElementById('queryInput').value=id;query()}
async function startAll(){if(!confirm('启动所有已停止的容器？'))return;try{const r=await fetch(API+'/api/containers/start-all',{method:'POST'});const d=await r.json();alert('成功: '+d.success_count+' 失败: '+d.fail_count);refreshData()}catch(e){alert('失败: '+e.message)}}
async function stopAll(){if(!confirm('停止所有运行中的容器？'))return;try{const r=await fetch(API+'/api/containers/stop-all',{method:'POST'});const d=await r.json();alert('成功: '+d.success_count+' 失败: '+d.fail_count);refreshData()}catch(e){alert('失败: '+e.message)}}
async function restartAll(){if(!confirm('重启所有容器？'))return;try{const r=await fetch(API+'/api/containers/restart-all',{method:'POST'});const d=await r.json();alert('成功: '+d.success_count+' 失败: '+d.fail_count);refreshData()}catch(e){alert('失败: '+e.message)}}
async function startContainer(n){try{const r=await fetch(API+'/api/containers/'+n+'/start',{method:'POST'});const d=await r.json();if(d.success)refreshData();else alert('失败: '+d.error)}catch(e){alert('失败: '+e.message)}}
async function stopContainer(n){if(!confirm('停止 '+n+'？'))return;try{const r=await fetch(API+'/api/containers/'+n+'/stop',{method:'POST'});const d=await r.json();if(d.success)refreshData();else alert('失败: '+d.error)}catch(e){alert('失败: '+e.message)}}
async function restartContainer(n){if(!confirm('重启 '+n+'？'))return;try{const r=await fetch(API+'/api/containers/'+n+'/restart',{method:'POST'});const d=await r.json();if(d.success)refreshData();else alert('失败: '+d.error)}catch(e){alert('失败: '+e.message)}}
async function showDetail(n){try{const r=await fetch(API+'/api/containers/'+n);const d=await r.json();document.getElementById('modalTitle').textContent='📦 '+d.Name;document.getElementById('modalBody').innerHTML='<div class="modal-item"><strong>ID:</strong> <code>'+d.ID+'</code></div><div class="modal-item"><strong>短ID:</strong> <code>'+d.IDShort+'</code></div><div class="modal-item"><strong>名称:</strong> '+d.Name+'</div><div class="modal-item"><strong>镜像:</strong> '+d.Image+'</div><div class="modal-item"><strong>状态:</strong> '+d.Status+'</div><div class="modal-item"><strong>运行时间:</strong> '+d.RunningTime+'</div><div class="modal-item"><strong>端口:</strong><br>'+d.Ports+'</div><div class="modal-item"><strong>挂载卷:</strong><br>'+d.Volumes+'</div>';document.getElementById('modal').style.display='block'}catch(e){alert('获取详情失败: '+e.message)}}
function closeModal(){document.getElementById('modal').style.display='none'}
window.onclick=function(e){if(e.target===document.getElementById('modal'))closeModal()}
function updateStats(c){const t=c.length,r=c.filter(x=>x.Status==='running').length,s=c.filter(x=>x.Status==='exited').length;document.getElementById('total').textContent=t;document.getElementById('running').textContent=r;document.getElementById('stopped').textContent=s;document.getElementById('other').textContent=t-r-s}
function renderTable(c){const b=document.getElementById('tableBody');if(!c||c.length===0){b.innerHTML='<tr><td colspan="7" class="loading">暂无容器</td></tr>';return}let h='';const q=document.getElementById('queryInput').value.trim().toLowerCase();c.forEach(x=>{const s=STATUS[x.Status]||{label:x.Status,icon:'⚪',cls:''};const run=x.Status==='running',stop=x.Status==='exited';const hl=q&&(x.ID.toLowerCase().includes(q)||x.IDShort.toLowerCase().includes(q)||x.Name.toLowerCase().includes(q));h+='<tr class="'+(hl?'highlight':'')+'" data-name="'+x.Name+'" data-id="'+x.ID+'"><td><span class="dot '+s.cls+'"></span> '+s.icon+' '+s.label+'</td><td class="name" onclick="showDetail(\''+x.Name+'\')">'+x.Name+'</td><td class="id" onclick="queryById(\''+x.ID+'\')" title="点击查询">'+x.IDShort+'</td><td>'+x.Image+'</td><td>'+(x.RunningTime||'N/A')+'</td><td>'+(x.Ports?x.Ports.split(',').map(p=>'<span class="tag">'+p.trim()+'</span>').join(''):'无')+'</td><td>'+(run?'<button class="action-btn stop" onclick="stopContainer(\''+x.Name+'\')">停止</button>':'')+(stop?'<button class="action-btn start" onclick="startContainer(\''+x.Name+'\')">启动</button>':'')+'<button class="action-btn restart" onclick="restartContainer(\''+x.Name+'\')">重启</button><button class="action-btn detail" onclick="showDetail(\''+x.Name+'\')">详情</button></td></tr>'});b.innerHTML=h}
function filterTable(){const s=document.getElementById('searchInput').value.toLowerCase();const st=document.getElementById('statusFilter').value;let d=queryResult||all;const f=d.filter(c=>c.Name.toLowerCase().includes(s)&&(st==='all'||c.Status===st));renderTable(f);const total=queryResult?' (查询 '+queryResult.length+' 个)':'';document.getElementById('tableInfo').textContent='显示 '+f.length+' 个容器'+total}
async function refreshData(){const b=document.querySelector('.btn-primary');b.textContent='⏳...';b.disabled=true;try{const c=await fetchData();all=c;if(queryResult){query()}else{updateStats(c);filterTable()}document.getElementById('updateTime').textContent='更新: '+new Date().toLocaleString();const hs=c.some(x=>x.Status==='exited');document.getElementById('statusBadge').textContent=hs?'⚠️ 有停止':'✅ 全部运行';document.getElementById('statusBadge').className='badge'+(hs?' warn':'')}catch(e){console.error(e)}finally{b.textContent='🔄 刷新';b.disabled=false}}
</script>
</body>
</html>
